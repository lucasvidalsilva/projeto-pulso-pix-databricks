name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar uv e Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: uv sync --locked --group dev

      - name: Verificar codigo Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Executar testes com cobertura
        run: |
          uv run pytest tests/unitarios \
            --cov=pulso_pix \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Construir e inspecionar wheel
        run: |
          uv build --wheel
          uv run python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('*.whl')); nomes = set(ZipFile(wheel).namelist()); esperados = {'pulso_pix/estatisticas_pix.py', 'pulso_pix/tarefa_estatisticas_pix.py', 'pulso_pix/sql/estatisticas_transacoes.sql', 'pulso_pix/sql/uso_pix_mensal.sql'}; ausentes = esperados - nomes; assert not ausentes, f'arquivos ausentes no wheel: {sorted(ausentes)}'"
