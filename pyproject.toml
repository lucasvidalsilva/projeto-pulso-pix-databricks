[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pulso-pix"
version = "0.1.0"
description = "Engenharia e produto de dados sobre o Pix no Brasil"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
processar_estatisticas_pix = "pulso_pix.tarefa_estatisticas_pix:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_pix"]

[tool.ruff]
line-length = 100
exclude = [".agents", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests/unitarios"]
