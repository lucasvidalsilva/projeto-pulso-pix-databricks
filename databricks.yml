bundle:
  name: pulso-pix

include:
  - resources/*.yml

artifacts:
  pacote:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalogo:
    description: Catalogo gerenciado disponivel na Free Edition.
    default: workspace
  schema_bronze:
    description: Schema da camada bruta implantavel somente em dev.
    default: bronze
  schema_silver:
    description: Schema da camada tratada implantavel somente em dev.
    default: silver
  schema_gold:
    description: Schema analitico da entrega Gold aprovada.
    default: gold
  warehouse_id:
    description: SQL warehouse usado pelo dashboard AI/BI em dev.
    lookup:
      warehouse: Serverless Starter Warehouse
  volume_respostas_pix:
    description: Volume gerenciado para respostas brutas da API do Pix.
    default: respostas_pix
  versao_implantacao:
    description: Commit Git associado ao deploy do bundle.
    default: local

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - .venv/**
    - .agents/**
    - .github/**
    - docs/**
    - tests/**
    - __pycache__/**

targets:
  dev:
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
