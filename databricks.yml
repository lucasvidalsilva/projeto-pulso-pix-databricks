bundle:
  name: pulso-pix

variables:
  catalogo:
    description: Catalogo de dados isolado por target; validar permissao antes de criar.
    default: pulso_pix_dev

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - .venv/**
    - .agents/**
    - .github/**
    - dados/**
    - docs/**
    - tests/**
    - __pycache__/**

targets:
  dev:
    default: true
    mode: development
    variables:
      catalogo: pulso_pix_dev
  prod:
    mode: production
    variables:
      catalogo: pulso_pix_prod
