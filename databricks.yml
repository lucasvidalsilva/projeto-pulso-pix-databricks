bundle:
  name: pulso-pix

variables:
  catalogo:
    description: Catalogo gerenciado disponivel na Free Edition.
    default: workspace
  schema_bronze:
    description: Schema da camada bruta implantavel somente em dev.
    default: bronze
  schema_silver:
    description: Schema da camada tratada implantavel somente em dev.
    default: silver
  schema_gold:
    description: Schema analitico; criar apenas quando houver entrega Gold.
    default: gold

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - .venv/**
    - .agents/**
    - .github/**
    - docs/**
    - tests/**
    - __pycache__/**

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
