bundle:
  name: pulso-pix

variables:
  catalogo:
    description: Catalogo logico; verificar disponibilidade antes de criar dados.
    default: pulso_pix
  sufixo_ambiente:
    description: Sufixo a aplicar aos objetos de dados quando houver implementacao.
    default: dev

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - .venv/**
    - .agents/**
    - .github/**
    - dados/**
    - docs/**
    - tests/**
    - __pycache__/**

targets:
  dev:
    default: true
    mode: development
    variables:
      sufixo_ambiente: dev
  portfolio:
    mode: production
    variables:
      sufixo_ambiente: portfolio
